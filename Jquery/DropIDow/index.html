<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto :  Drag & Drop</title>

    <style>

        #objeto{
            background-color: black;
            width: 100px;
            height: 100px;
            position: absolute;
            cursor: move;
        }
        
    </style>

</head>
<body>

    <div id="objeto"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    
    <script>

        // O que é um Drag & Drop?

        // R: Arrastar e soltar, nomenclatura utilizada nas interfaces gráficas de computadores,
        // é a ação de clicar em um objeto virtual e "arrastá-lo" a uma posição diferente ou sobre 
        // um outro objeto virtual.


           $(function(){

            // Aqui podemos notar que o evento de mousedown, foi criado primeiro quando o Usúario 
            // preciona o botão do mouse sobre o elemento, e logo depois o evento de mousemove é 
            // criado para quando o usuario mover o mouse em cima do evento.

            $("#objeto").bind("mousedown", function(){
                $("#objeto").bind("mousemove", function(e){
                    // Esse "ORIGINALEVENT", podemos achar em console, buscando em originalEvent originalevent (kkk);
                    // ele referece a posição da página;
                    // guardamos esses dados elementos,  dentro de uma variavel X e Y, porque depois vamos precisar 
                    // usalar dentro de um "CSS",
                    var x = e.originalEvent.pageX;
                    var y = e.originalEvent.pageY;

                    
                    // so precisamos disso porque , se não usarmos , na hora que a gente tentar arrastar nosso 
                    // elemento , a nossa seta vai ser alocada na ponta do nosso quadrado;
                    var width = $(this).width();
                    var height = $(this).height();

                    // passo a passo de como esta sendo utilizado esse código aqui:
                    // pegamos nosso elemento utilizando o "THIS", depois vamos add um "CSS", depois pegarmos nosso X
                    // e por um sinal de menos o nosso WIDTH/2 + os pixels; 
                    $(this).css("left", (x - width/2)+"px")
                    $(this).css("top", (y - height/2)+"px")

                    console.log(e)
                });
            });

            // Essa função só serve para DESABILITAR  o evento do mouseUp(quando o usúario
            // solta o botão do mouse sobre o elemento);
            $("#objeto").bind("mouseup", function(){
                $("#objeto").unbind("mousemove");
            });

           });
        
    </script>
    
</body>
</html>
