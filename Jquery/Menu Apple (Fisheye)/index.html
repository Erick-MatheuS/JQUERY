<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <title>Replicando o menu da Apple</title>

    <style>

        body{
            margin: 0;
        }

        .container{
            width: 900px;
            height: 100px;
            background-color: #eee;
            margin: 300px auto;
            /* margin-left: -400px; */
        }

        .icon{
            width: 100px;
            height: 100px;
            background-color: #bbc;
            float: left;
            border-radius: 20px;
            margin-right: 50px;
            cursor: pointer;
        }

    </style>

</head>
<body>

    <div class="container">
        <div class="icon"></div>
        <div class="icon"></div>
        <div class="icon"></div>
        <div class="icon"></div>
        <div class="icon"></div>
    </div>

    <script>

        $(function(){

            $(".icon").hover(function(){
                $(this).animate({
                    "width": 130,
                    "height": 130,
                    "margin-top": -30,
                }, 400)

            }, function(){
                $(this).animate({
                    "width": 100,
                    "height": 100,
                    "margin-top": 0,
                }, 400)
            })
        })

    </script>
    
</body>
</html>
